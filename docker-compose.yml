services:
  db:
    image: postgres:17
    container_name: frimmy-db
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - "5432:5432"
    volumes:
      - frimmy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frimmy -d frimmy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frimmy-pgdata:
