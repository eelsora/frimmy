spring:
  application:
    name: frimmy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/frimmy
    username: ${DB_USERNAME:frimmy}
    password: ${DB_PASSWORD:frimmy}

  jpa:
    hibernate:
      # 스키마 생성/변경은 Flyway가 담당. JPA는 매핑 검증만 수행.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o

server:
  port: 8080
